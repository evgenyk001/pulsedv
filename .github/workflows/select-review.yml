name: Select mobile review
on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/mini-app/src/pages/selection.tsx'
      - 'apps/mini-app/src/pages/selection.module.css'
      - 'tests/ui/select-composer.spec.ts'
      - 'tests/ui/select-strict-home.spec.ts'
      - 'packages/domain/propertyMatch.ts'
      - 'packages/domain/catalogPopularity.ts'
      - 'tests/ui/mini-app.spec.ts'
      - '.github/workflows/select-review.yml'
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build -w apps/mini-app
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test tests/ui/select-composer.spec.ts tests/ui/select-strict-home.spec.ts --workers=1
      - run: npx playwright test tests/ui/mini-app.spec.ts --grep 'PULSE Select smart query' --workers=1
      - run: npx playwright test --config=playwright.finance-webkit.config.ts tests/ui/select-composer.spec.ts tests/ui/select-strict-home.spec.ts --workers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pulse-select-review
          path: |
            test-results/select-composer-*.png
            test-results/select-strict-*.png
            playwright-report
            playwright-report-finance-webkit
