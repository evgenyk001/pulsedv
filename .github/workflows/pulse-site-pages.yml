name: Deploy PULSE.DV site

on:
  push:
    branches: ["main"]
    paths:
      - "dist/**"
      - "apps/mini-app/**"
      - ".github/workflows/pulse-site-pages.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "apps/mini-app/**"
      - ".github/workflows/pulse-site-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pulse-pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Mini App dependencies
        working-directory: apps/mini-app
        run: npm install --no-audit --no-fund
      - name: Enforce public/private boundary
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -nE '"/(admin|login)|to="/(admin|login)|startsWith\("/admin' apps/mini-app/src --include='*.ts' --include='*.tsx'; then
            echo "Admin/login routes must live in apps/control-center, never in the public Mini App."
            exit 1
          fi
      - name: Typecheck Mini App
        working-directory: apps/mini-app
        run: npm run check
      - name: Build Mini App
        working-directory: apps/mini-app
        run: npm run build
      - name: Check landing JavaScript
        run: node --check dist/script.js

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Mini App dependencies
        working-directory: apps/mini-app
        run: npm install --no-audit --no-fund
      - name: Enforce public/private boundary
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -nE '"/(admin|login)|to="/(admin|login)|startsWith\("/admin' apps/mini-app/src --include='*.ts' --include='*.tsx'; then
            echo "Admin/login routes must live in apps/control-center, never in the public Mini App."
            exit 1
          fi
      - name: Typecheck Mini App
        working-directory: apps/mini-app
        run: npm run check
      - name: Build Mini App
        working-directory: apps/mini-app
        run: npm run build
      - name: Check landing JavaScript
        run: node --check dist/script.js
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
