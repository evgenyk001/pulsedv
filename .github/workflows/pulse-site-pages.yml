name: Deploy PULSE.DV site

on:
  push:
    branches: ["main"]
    paths:
      - "dist/**"
      - "apps/mini-app/**"
      - ".github/workflows/pulse-site-pages.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "apps/mini-app/**"
      - ".github/workflows/pulse-site-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pulse-pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mini-app/package.json
      - name: Install Mini App dependencies
        working-directory: apps/mini-app
        run: npm install --no-audit --no-fund
      - name: Typecheck Mini App
        working-directory: apps/mini-app
        run: npm run check
      - name: Build Mini App
        working-directory: apps/mini-app
        run: npm run build
      - name: Check landing JavaScript
        run: node --check dist/script.js
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
