name: Build PULSE.DV funnel preview

on:
  push:
    branches: ["site-funnel-v1"]
    paths:
      - "apps/web/**"
      - ".github/workflows/pulse-site-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pulse-funnel-preview"
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        working-directory: apps/web
        run: npm install

      - name: Typecheck and build
        working-directory: apps/web
        run: npm run build

      - name: Publish preview branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./apps/web/dist
          publish_branch: site-funnel-preview
          force_orphan: true
          enable_jekyll: false
