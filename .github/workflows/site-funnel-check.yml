name: Site funnel check

on:
  push:
    branches:
      - site-funnel-v1
    paths:
      - "apps/web/**"
      - ".github/workflows/site-funnel-check.yml"
  pull_request:
    paths:
      - "apps/web/**"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package.json
      - name: Install
        run: npm install
      - name: Typecheck and build
        run: npm run build
