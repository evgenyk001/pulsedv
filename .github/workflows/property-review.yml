name: Property mobile review
on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/mini-app/src/pages/property.*'
      - 'apps/mini-app/src/components/AppShell*'
      - 'tests/ui/property-experience.spec.ts'
      - '.github/workflows/property-review.yml'
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test tests/ui/property-experience.spec.ts --workers=1
      - run: npx playwright test --config=playwright.finance-webkit.config.ts tests/ui/property-experience.spec.ts --workers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pulse-property-review
          path: |
            test-results/property-*.png
            playwright-report
            playwright-report-finance-webkit
