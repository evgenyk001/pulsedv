name: Site single-screen check

on:
  push:
    branches:
      - site-single-screen-v1
    paths:
      - "apps/web/**"
      - ".github/workflows/site-single-screen-check.yml"
  pull_request:
    paths:
      - "apps/web/**"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm install
      - name: Build
        run: npm run build
