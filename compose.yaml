name: pulsedv
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pulse
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulse -d pulse"]
      interval: 10s
      timeout: 5s
      retries: 10
  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    environment: &api_environment
      NODE_ENV: production
      DATABASE_URL: postgres://pulse:${POSTGRES_PASSWORD}@db:5432/pulse
      PUBLIC_ORIGIN: https://${SITE_DOMAIN:?Set SITE_DOMAIN}
      BOT_TOKEN: ${BOT_TOKEN:-}
      MAP_2GIS_KEY: ${MAP_2GIS_KEY:-}
      CONSENT_VERSION: ${CONSENT_VERSION:-2026-09-25}
      MEDIA_ROOT: /data/media
      TRUST_PROXY_HOPS: 1
    volumes:
      - media_data:/data/media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
  worker:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    command: ["node", "--import", "tsx", "backend/src/worker.ts"]
    environment: *api_environment
    depends_on:
      api:
        condition: service_healthy
  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - media_data:/srv/media:ro
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  media_data:
